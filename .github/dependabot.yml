version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels: [dependencies]
    # pytest-benchmark 5.3 uses Node._nodeid, removed in pytest 9.2.
    ignore:
      - dependency-name: pytest
        versions: [">=9.2"]
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels: [dependencies]
    # typescript-eslint's compiler API requires TypeScript below 6.1.
    ignore:
      - dependency-name: typescript
        versions: [">=6.1"]
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
