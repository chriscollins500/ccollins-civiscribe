name: Publish to ComfyUI Registry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comfy-registry-publish
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-validation.yml

  github-release:
    if: github.ref == 'refs/heads/main'
    needs: validate
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-${{ github.sha }}
          path: dist
      - name: Require configured human release approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/environments/release" --jq '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[]] | length > 0')" = true
      - run: python -m tools.release_bundle verify --commit "$GITHUB_SHA"
      - name: Attest the tested, unchanged artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*
      - name: Prepare update notes
        run: python -m tools.prepare_registry_changelog --output "$RUNNER_TEMP/civiscribe-registry-changelog.md"
      - name: Publish GitHub release without replacing existing tags or assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'from civiscribe.version import __version__; print(__version__)')
          test -z "$(git ls-remote --tags origin "refs/tags/v$VERSION")"
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "CiviScribe $VERSION" --notes-file "$RUNNER_TEMP/civiscribe-registry-changelog.md"

  publish:
    if: github.ref == 'refs/heads/main'
    needs: github-release
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-${{ github.sha }}
          path: dist
      - name: Install pinned publishing tools
        run: python -m pip install "comfy-cli==1.16.0" "httpx==0.28.1"
      - name: Preflight helper imports before creating an immutable version
        run: |
          python -c "from tools.verify_registry_listing import load_project_registry_metadata; load_project_registry_metadata()"
          python -m tools.release_bundle verify --commit "$GITHUB_SHA"
      - name: Prepare Registry update notes
        run: python -m tools.prepare_registry_changelog --output "$RUNNER_TEMP/civiscribe-registry-changelog.md"
      - name: Publish the previously tested Registry archive (no rebuild)
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: python -m tools.publish_registry_bundle --commit "$GITHUB_SHA" --changelog "$RUNNER_TEMP/civiscribe-registry-changelog.md"
      - name: Synchronize and verify public Registry listing
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: >-
          python -m tools.verify_registry_listing
          --sync-description
          --attempts 12
          --poll-delay-seconds 5
