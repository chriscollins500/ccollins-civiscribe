name: Publish to ComfyUI Registry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comfy-registry-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install development orchestrator
        run: python -m pip install "nox>=2025.2.9" "uv>=0.8,<1"

      - name: Run Python, frontend, and release validation
        run: python -m nox -s python frontend build

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REGISTRY_CHANGELOG_FILE: ${{ runner.temp }}/civiscribe-registry-changelog.md
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pinned Comfy CLI
        run: python -m pip install "comfy-cli==1.16.0"

      - name: Prepare Registry update notes
        run: python -m tools.prepare_registry_changelog --output "$REGISTRY_CHANGELOG_FILE"

      - name: Publish immutable Registry version
        shell: bash
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "$REGISTRY_ACCESS_TOKEN" --changelog-file "$REGISTRY_CHANGELOG_FILE"
