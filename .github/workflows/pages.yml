name: Website

on:
  push:
    branches: [main]
    paths:
      - docs/site/**
      - docs/wiki/**
      - docs/examples/**
      - docs/*.md
      - docs/dev/*.md
      - assets/branding/**
      - civiscribe/version.py
      - civiscribe/schemas/api-v1.openapi.json
      - CHANGELOG.md
      - README.md
      - ROADMAP.md
      - SUPPORT.md
      - SECURITY.md
      - CONTRIBUTING.md
      - CODE_OF_CONDUCT.md
      - .github/ISSUE_TEMPLATE/**
      - .github/DISCUSSION_TEMPLATE/**
      - .github/pull_request_template.md
      - tools/sync_wiki.py
      - tools/audit_paths.py
      - tools/validate_public_project.py
      - tools/validate_repository_docs.py
      - tools/audit_public_docs.mjs
      - tools/build_site.py
      - tools/validate_site.py
      - tests/site/**
      - package-lock.json
      - package.json
      - pyproject.toml
      - uv.lock
      - .oxlintrc.json
      - .github/workflows/pages.yml
  # The required PR job must produce a result for every proposed merge.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Website build and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Install pinned documentation tools
        run: 'python -m pip install --only-binary=:all: --require-hashes -r docs/site/requirements.txt'
      - name: Install locked browser-test tools
        run: npm ci
      - name: Check site source formatting
        run: npx --no-install prettier --check 'docs/site/**/*.{html,css,js}' 'tests/site/*.mjs' tools/audit_public_docs.mjs docs/site/.oxlintrc.json tests/site/.oxlintrc.json
      - name: Lint browser code and website tests
        run: |
          npx --no-install oxlint --deny-warnings -c docs/site/.oxlintrc.json docs/site/assets
          npx --no-install oxlint --deny-warnings -c tests/site/.oxlintrc.json tests/site tools/audit_public_docs.mjs
      - name: Build reviewed documents and audit public output
        run: |
          python -m tools.validate_repository_docs
          python -m tools.validate_public_project
          python -m tools.build_site
          python -m tools.validate_site
      - name: Test educational models
        run: node --test tests/site/*.test.mjs
      - name: Install the test browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Allow the exact test browser to create its sandbox
        run: |
          browser_path="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log(chromium.executablePath())')"
          test -x "$browser_path"
          cat <<EOF | sudo tee /etc/apparmor.d/civiscribe-playwright >/dev/null
          abi <abi/4.0>,
          include <tunables/global>
          profile civiscribe-playwright "$browser_path" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/civiscribe-playwright
      - name: Check desktop, mobile, keyboard, and accessibility behavior
        run: npx --no-install playwright test --config tests/site/playwright.config.mjs
      - name: Upload the tested Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .tmp/site-preview/ccollins-civiscribe
          include-hidden-files: true
          retention-days: 7

  wiki:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Check out the existing wiki using the job-scoped token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' clone --depth 1 --no-tags "https://github.com/$GITHUB_REPOSITORY.wiki.git" .tmp/wiki-publish
      - name: Synchronize only reviewed pages and verify the result
        run: |
          python -m tools.sync_wiki --wiki-root .tmp/wiki-publish --write
          python -m tools.sync_wiki --wiki-root .tmp/wiki-publish
      - name: Publish a fast-forward wiki update
        working-directory: .tmp/wiki-publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.md'
          if ! git diff --cached --quiet; then
            git commit -m "Publish reviewed guides from $GITHUB_SHA"
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD
          fi
      - name: Verify the published wiki from a fresh read
        run: |
          git clone --depth 1 --no-tags "https://github.com/$GITHUB_REPOSITORY.wiki.git" .tmp/wiki-readback
          python -m tools.sync_wiki --wiki-root .tmp/wiki-readback

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, wiki]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      attestations: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Retrieve the exact tested artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: github-pages
          path: site-artifact
      - name: Sign the tested website artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: site-artifact/artifact.tar
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-publication:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
      - name: Rebuild reviewed documentation with locked wheel hashes
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r docs/site/requirements.txt
          python -m tools.build_site
      - name: Verify every live website file
        run: node tools/audit_public_docs.mjs
      - name: Compare the published wiki with the same source commit
        run: |
          git clone --depth 1 --no-tags "https://github.com/$GITHUB_REPOSITORY.wiki.git" .tmp/wiki-verify
          python -m tools.sync_wiki --wiki-root .tmp/wiki-verify
      - name: Verify the exact deployed artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name github-pages --dir .tmp/pages-provenance
          gh attestation verify .tmp/pages-provenance/artifact.tar --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/pages.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
