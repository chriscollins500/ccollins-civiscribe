name: Release candidate validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - run: python -m pip install "nox>=2025.2.9" "uv>=0.8,<1"
      - run: python -m nox -s release
      - name: Bind once-built artifacts to this source commit
        run: python -m tools.release_bundle prepare --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: benchmark-${{ github.sha }}
          path: .benchmarks/
          include-hidden-files: true

  installed-package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-${{ github.sha }}
          path: dist
      - run: python -m tools.release_bundle verify --commit "$GITHUB_SHA"
      - name: Install the exact wheel outside the source import path
        run: |
          python -m pip install --require-hashes -r dist/runtime-requirements.txt
          python -m pip install --no-deps dist/*.whl
          python -I tools/release_corpus.py --require-installed --output .tmp/wheel-corpus
      - name: Stage and exercise the exact custom-node ZIP
        run: |
          python -m tools.release_bundle stage --commit "$GITHUB_SHA" --destination .tmp/custom-node
          PYTHONPATH="$PWD/.tmp/custom-node" python tools/release_corpus.py --package-root .tmp/custom-node --output .tmp/zip-corpus
      - name: Exercise source distribution in an isolated interpreter
        run: |
          python -m venv .tmp/sdist-smoke
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.tmp/sdist-smoke/Scripts/python.exe; else PY=.tmp/sdist-smoke/bin/python; fi
          "$PY" -m pip install --require-hashes -r dist/runtime-requirements.txt
          "$PY" -m pip install --no-deps dist/*.tar.gz
          "$PY" -I tools/release_corpus.py --require-installed --output .tmp/sdist-corpus
      - name: Independent PNG, JPEG, WebP readers (required, no silent skips)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl pngcheck libjpeg-turbo-progs webp
          python -m tools.audit_image_conformance .tmp/wheel-corpus/*.png .tmp/wheel-corpus/*.jpg .tmp/wheel-corpus/*.webp --require-tools --report .tmp/conformance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: installed-evidence-${{ matrix.os }}-${{ github.sha }}
          path: .tmp/conformance.json
          if-no-files-found: ignore

  live-v3:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Comfy-Org/ComfyUI
          ref: 856a922befab9d94cb66f36a3dce17234d7a6e31
          path: .tmp/comfy
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.19.0"
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-${{ github.sha }}
          path: dist
      - name: Prepare isolated CPU runtime and browser
        run: |
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r .tmp/comfy/requirements.txt
          python -m pip install --require-hashes -r dist/runtime-requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify current V3, native widgets, serialization, resizing, locales, and Axe
        run: python -m tools.test_comfy_artifact --comfy .tmp/comfy --python "$(which python)" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: live-v3-evidence-${{ github.sha }}
          path: |
            test-results/
            .tmp/release-reports/
          include-hidden-files: true
