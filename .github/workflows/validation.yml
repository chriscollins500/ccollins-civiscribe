name: Validation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.2"
          cache: npm

      - name: Install development orchestrator
        run: python -m pip install "nox>=2026.10.20" "uv>=0.13.6,<1"

      - name: Run Python, frontend, and release validation
        run: python -m nox -s python frontend build

      - name: Check release regressions and audits for dependency proposals
        if: >-
          github.event_name == 'pull_request' &&
          (github.actor == 'dependabot[bot]' ||
          contains(github.event.pull_request.labels.*.name, 'dependencies'))
        run: python -m nox -s release-tests bench supply-chain

      - name: Upload audited release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ccollins-civiscribe
          path: dist/
          if-no-files-found: error
          retention-days: 14
