name: Dependency review

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base commit, tag, or branch to compare
        default: main
        required: true
      head_ref:
        description: Head commit, tag, or branch to compare
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check introduced dependencies for known vulnerabilities
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          base-ref: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
          head-ref: ${{ github.event.pull_request.head.sha || inputs.head_ref }}
          fail-on-severity: moderate
          license-check: false
          comment-summary-in-pr: never
          show-openssf-scorecard: false
