[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[project]
name = "ccollins-civiscribe"
dynamic = ["version"]
description = "Make every ComfyUI image Civitai-ready. CiviScribe saves PNG, JPEG, and WebP with your prompts, generation settings, model, LoRAs, hashes, and only the resources actually used. PNG files can also carry a reloadable workflow, so your uploads keep their creation details without manual metadata work."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "CCollins' CiviScribe contributors" }
]
dependencies = [
  "Pillow>=13,<14",
  "certifi>=2026.10.23",
  "httpx>=0.28.1,<1",
  "numpy>=2.5.4,<3",
  "truststore>=0.10.5,<1; platform_system == 'Windows' or platform_system == 'Darwin'",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]

[project.urls]
Repository = "https://github.com/chriscollins500/ccollins-civiscribe"
Documentation = "https://github.com/chriscollins500/ccollins-civiscribe/wiki"
"Bug Tracker" = "https://github.com/chriscollins500/ccollins-civiscribe/issues"

[tool.comfy]
PublisherId = "chrisecollins500"
DisplayName = "CCollins' CiviScribe"
Icon = "https://raw.githubusercontent.com/chriscollins500/ccollins-civiscribe/main/assets/branding/civiscribe-icon.png"
Banner = "https://raw.githubusercontent.com/chriscollins500/ccollins-civiscribe/main/assets/branding/civiscribe-banner.png"
requires-comfyui = ">=0.33.1"

[tool.comfy.version]
path = "civiscribe/version.py"

[dependency-groups]
dev = [
  "build>=1.6.1,<2",
  "check-wheel-contents>=0.6.3,<1",
  "hypothesis>=6.170.15,<7",
  "jsonschema>=4.26,<5",
  "mypy>=2.4.1,<3",
  "nox>=2026.10.20",
  "pip-audit>=2.10.1,<3",
  "pip-licenses>=5.5.5,<6",
  "pytest>=9.2,<10",
  "pytest-benchmark>=5.3.1,<6",
  "pytest-cov>=7.1,<8",
  "pytest-randomly>=5.1,<6",
  "pytest-socket>=0.8.1,<1",
  "pytest-timeout>=2.4,<3",
  "pytest-xdist>=3.8,<4",
  "PyYAML>=6.0.3,<7",
  "ruff>=0.17.5,<1",
  "types-jsonschema>=4.26.0.20261006,<5",
  "types-PyYAML>=6.0.12.20261113,<7",
  "uv>=0.13.8,<1",
]

[tool.hatch.version]
path = "civiscribe/version.py"

[tool.hatch.build.targets.wheel]
packages = ["civiscribe"]

[tool.hatch.build.targets.sdist]
include = [
  "/__init__.py",
  "/civiscribe",
  "/locales",
  "/web/runtime",
  "/LICENSE",
  "/README.md",
]
artifacts = ["/web/runtime/*.js"]

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "-m", "not release and not performance",
]
testpaths = ["tests"]
markers = [
  "release: opt-in real subprocess crash and release integration checks",
  "performance: advisory benchmark and allocation measurements",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "B",
  "C4",
  "E",
  "F",
  "FA",
  "I",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "RUF",
  "S",
  "SIM",
  "T20",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
"**/*.py" = ["N999"]
"__init__.py" = ["PLC0415"]
"tests/**/*.py" = ["S101"]
"tools/**/*.py" = ["T201"]
"typing_stubs/**/*.pyi" = ["A002", "ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "typing_stubs"
packages = ["civiscribe"]
files = ["tools", "tests"]
exclude = ["web"]

[tool.coverage.run]
branch = true
source = ["civiscribe"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
